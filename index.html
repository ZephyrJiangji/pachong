<title>爬宠基因库 · REPTILE GENOME ARCHIVE</title>
<style>
:root{
  --bg:#05070c;--panel:rgba(8,18,34,.82);--cyan:#00f0ff;--cyan-dim:rgba(0,240,255,.14);
  --purple:#a855f7;--purple-dim:rgba(168,85,247,.16);--text:#d7f6ff;--muted:#7aa3b8;
  --line:rgba(0,240,255,.28);--warn:#ffb020;
  --hud:"SF Mono","Menlo","Consolas","Courier New",ui-monospace,monospace;
  --display:"DIN Alternate","Eurostile",ui-sans-serif,sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
#fx-grid,#fx-scan,#fx-particles{position:fixed;inset:0;pointer-events:none;z-index:0}
#fx-grid{background-image:linear-gradient(rgba(0,240,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse at center,#000 40%,transparent 82%)}
#fx-scan{background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,240,255,.035) 3px 4px);animation:scan-drift 9s linear infinite;opacity:.55}
@keyframes scan-drift{to{background-position:0 120px}}
.hud-frame{position:fixed;inset:10px;pointer-events:none;z-index:8;border:1px solid rgba(0,240,255,.18)}
.hud-frame:before,.hud-frame:after,.hud-frame span:before,.hud-frame span:after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cyan)}
.hud-frame:before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hud-frame:after{top:-1px;right:-1px;border-left:0;border-bottom:0}
.hud-frame span:before{bottom:-1px;left:-1px;border-right:0;border-top:0}
.hud-frame span:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.app{position:relative;z-index:1;min-height:100dvh}
.screen{display:none;min-height:100dvh}
.screen.on{display:block}
.cover{display:none;min-height:100dvh;padding:18px 18px 28px;position:relative;flex-direction:column}
.cover.on{display:flex}
.cover.go{animation:cover-out .55s ease forwards}
@keyframes cover-out{to{opacity:0;filter:brightness(2);transform:scale(1.04)}}
.status{display:flex;justify-content:space-between;gap:8px;font-family:var(--hud);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.status b{color:var(--cyan);font-weight:400}
.cover-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dna{width:min(78vw,280px);height:168px;margin-bottom:10px;perspective:520px}
.dna canvas{width:100%;height:100%;display:block}
.title-en{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,6.4vw,2.05rem);letter-spacing:.18em;line-height:1.25;text-shadow:0 0 18px rgba(0,240,255,.45)}
.title-zh{margin-top:8px;font-size:1.35rem;letter-spacing:.42em;text-indent:.42em;color:var(--cyan)}
.title-sub{margin-top:12px;font-family:var(--hud);font-size:10px;letter-spacing:.16em;color:var(--muted);line-height:1.6}
.enter{margin-top:34px;padding:14px 28px;min-width:220px;font-family:var(--display);font-size:14px;letter-spacing:.18em;color:#041018;background:linear-gradient(90deg,var(--cyan),#67e8f9 40%,var(--purple));clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);box-shadow:0 0 24px rgba(0,240,255,.28)}
.cover-foot{font-family:var(--hud);font-size:10px;color:var(--muted);letter-spacing:.12em;text-align:center}
.archive{padding:18px 16px 56px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:40px;height:40px;flex:none;border:1px solid var(--line);color:var(--cyan);background:var(--cyan-dim);clip-path:polygon(8px 0,100% 0,100% 32px,32px 100%,0 100%,0 8px);font-size:22px;line-height:38px}
.search{flex:1;position:relative}
.search input{width:100%;height:40px;padding:0 12px 0 36px;background:rgba(0,20,36,.7);border:1px solid var(--line);outline:none;font-family:var(--hud);font-size:16px;-webkit-appearance:none;border-radius:0}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}
.search .ico{position:absolute;left:12px;top:11px;width:16px;height:16px;border:2px solid var(--cyan);border-radius:50%}
.search .ico:after{content:"";position:absolute;width:8px;height:2px;background:var(--cyan);right:-6px;bottom:-2px;transform:rotate(45deg)}
.kicker{font-family:var(--hud);font-size:10px;letter-spacing:.18em;color:var(--purple);text-transform:uppercase}
.h1{font-family:var(--display);font-size:1.15rem;letter-spacing:.12em;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.gene,.hit{position:relative;padding:12px;background:var(--panel);border:1px solid var(--line);text-align:left;overflow:hidden;animation:rise .4s ease both;width:100%}
.card:before,.gene:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thumb{height:72px;margin-bottom:8px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,var(--purple-dim),transparent 55%),linear-gradient(160deg,rgba(0,240,255,.08),rgba(168,85,247,.08));border:1px solid rgba(0,240,255,.12)}
.thumb svg{width:58px;height:58px}
.card h3,.gene h3,.hit h3{font-size:.95rem}
.en{font-family:var(--hud);font-size:10px;color:var(--cyan);letter-spacing:.06em;margin-top:2px}
.sci{font-size:10px;color:var(--muted);font-style:italic;margin-top:4px}
.badge{display:inline-block;margin-top:8px;font-family:var(--hud);font-size:10px;letter-spacing:.08em;color:var(--cyan);border:1px solid var(--line);padding:3px 6px}
.sec{margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec b{font-family:var(--hud);font-size:11px;letter-spacing:.14em;color:var(--cyan)}
.sec i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);font-style:normal}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tag{flex:none;font-family:var(--hud);font-size:10px;letter-spacing:.08em;padding:3px 7px;border:1px solid currentColor}
.tag.recessive{color:#67e8f9}.tag.dominant{color:#c084fc}.tag.incomplete{color:#f0abfc}
.tag.polygenic{color:#fbbf24}.tag.compound{color:#fb7185}.tag.suspected{color:#fdba74}
.tag.hybrid{color:#86efac}.tag.regional{color:#5eead4}.tag.unknown{color:#94a3b8}
.meta{font-family:var(--hud);font-size:11px;color:var(--muted);margin-top:4px}
.note{font-size:12px;line-height:1.7;color:#9ec2d3;margin:8px 0 14px}
.warn{color:var(--warn);font-size:12px;line-height:1.65;margin-top:6px}
.photo{width:100%;height:160px;object-fit:cover;background:#071018;border:1px solid var(--line);margin:8px 0 4px;display:block}
.photo-ph{height:160px;margin:8px 0 4px;display:grid;place-items:center;border:1px dashed var(--line);color:var(--muted);font-family:var(--hud);font-size:11px;letter-spacing:.12em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:12px;line-height:1.6}
.cols b{display:block;font-family:var(--hud);font-size:10px;letter-spacing:.12em;color:var(--purple);margin-bottom:4px}
.panel{margin-top:12px;padding:14px;background:var(--panel);border:1px solid var(--line)}
.panel h4{font-family:var(--hud);font-size:11px;letter-spacing:.16em;color:var(--purple);margin-bottom:8px}
.panel p{font-size:14px;line-height:1.75;color:#c5e6f2}
.head{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.empty{padding:36px 12px;text-align:center;color:var(--muted);font-family:var(--hud)}
.legal{margin-top:28px;text-align:center;font-size:11px;color:#5b7d90;line-height:1.75}
.hit .sp{font-size:10px;color:var(--muted);margin-top:4px}
@media(min-width:720px){.archive{max-width:980px;margin:0 auto}.grid{grid-template-columns:1fr 1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function hay(sp,g){
  var a=[sp.nameZh,sp.nameEn,sp.scientific,g.nameZh,g.nameEn,g.id,g.phenotype,g.composition,g.appearance,g.note];
  if(g.aliases)a=a.concat(g.aliases);
  var t=INH[g.inheritance];if(t)a.push(t.zh,t.en);
  return a.join(" ").toLowerCase();
}
function searchAll(query){
  if(!query)return [];
  var qq=query.toLowerCase(),out=[];
  for(var i=0;i<DATA.species.length;i++){
    var sp=DATA.species[i];
    for(var j=0;j<sp.genes.length;j++){
      if(hay(sp,sp.genes[j]).indexOf(qq)!==-1)out.push({sp:sp,g:sp.genes[j]});
    }
  }
  return out;
}

  var list=[];
  for(var i=0;i<sp.genes.length;i++){if(sp.genes[i].kind===kind) list.push(sp.genes[i]);}
  if(q){var qq=q.toLowerCase();var f=[];for(var j=0;j<list.length;j++){if(hay(sp,list[j]).indexOf(qq)!==-1)f.push(list[j]);}list=f;}
  if(!list.length)return "";
  var html=sec(title)+'<div class="list">';
  for(var i=0;i<list.length;i++) html+=geneBtn(sp,list[i],i);
  html+="</div>";
  return html;
}
function speciesCard(s,i){
  var c=counts(s);
  return '<button type="button" class="card" data-go="species" data-id="'+esc(s.id)+'" style="animation-delay:'+(i*30)+'ms"><div class="thumb">'+(ICONS[s.icon]||ICONS.bd)+'</div><h3>'+esc(s.nameZh)+'</h3><div class="en">'+esc(s.nameEn)+'</div><div class="sci">'+esc(s.scientific)+'</div><span class="badge">GENE '+c.g+' · COMBO '+c.c+'</span></button>';
}
function homeView(){
  var hits=q?searchAll(q):[];
  var blocks="";
  var groups=DATA.groups;
  for(var gi=0;gi<groups.length;gi++){
    var gr=groups[gi], cards="", n=0;
    for(var i=0;i<DATA.species.length;i++){
      if(DATA.species[i].group===gr.id){cards+=speciesCard(DATA.species[i],n);n++;}
    }
    if(n) blocks+=sec(gr.en+" // "+gr.zh)+'<div class="grid">'+cards+'</div>';
  }
  var hitHtml="";
  if(q){
    if(!hits.length) hitHtml='<p class="empty">NO MATCH // 未找到基因、表现型或复合品系</p>';
    else{
      hitHtml=sec("CROSS-TAXON HITS // 跨物种 "+hits.length)+'<div class="list">';
      for(var k=0;k<hits.length;k++){
        var h=hits[k];
        hitHtml+='<button type="button" class="hit" data-go="gene" data-sid="'+esc(h.sp.id)+'" data-id="'+esc(h.g.id)+'"><div class="row"><div><h3>'+esc(h.g.nameZh)+' / '+esc(h.g.nameEn)+'</h3><div class="sp">'+esc(h.sp.nameZh)+' · '+esc(h.sp.nameEn)+'</div></div>'+tag(h.g.inheritance)+'</div><p class="note">'+esc(h.g.phenotype)+'</p>'+(h.g.composition?'<div class="meta">'+esc(h.g.composition)+(h.g.appearance?" · "+h.g.appearance:"")+'</div>':'')+'</button>';
      }
      hitHtml+="</div>";
    }
  }
  return '<div class="status" style="margin-bottom:12px"><span>ARCHIVE <b>ONLINE</b></span><span>TAXA <b>'+String(DATA.species.length).padStart(2,"0")+'</b></span><span>NODE <b>CORE</b></span></div><div class="topbar">'+searchBox("搜索基因 / 表现型 / 复合品系",q)+'</div><div class="kicker">TAXON INDEX</div><h2 class="h1">全库物种档案</h2>'+blocks+hitHtml;
}
function speciesView(sp){
  var c=counts(sp);
  var body=group(sp,"gene","SINGLE GENE // 单基因")+group(sp,"combo","COMBO // 复合品系")+group(sp,"select","LINE-BRED // 选育品系")+group(sp,"regional","LOCALITY // 地域种")+group(sp,"suspected","UNCONFIRMED // 疑似 / 待确证");
  if(!body && q) body='<p class="empty">NO MATCH // 本物种无匹配条目</p>';
  return '<div class="topbar"><button type="button" class="back" data-go="home" aria-label="返回">‹</button>'+searchBox("在本物种中搜索",q)+'</div><div class="head"><div class="thumb">'+(ICONS[sp.icon]||ICONS.bd)+'</div><div><div class="kicker">'+esc(sp.clade)+'</div><h2 class="h1" style="margin:4px 0 0">'+esc(sp.nameZh)+'</h2><div class="en">'+esc(sp.nameEn)+'</div><div class="sci">'+esc(sp.scientific)+'</div></div></div><p class="meta">ORIGIN // '+esc(sp.origin)+' · GENE '+c.g+' · COMBO '+c.c+'</p><p class="note">'+esc(sp.blurb)+'</p>'+body+'<div class="panel"><h4>NOTES // 遗传备注</h4><p>'+esc(sp.notes)+'</p></div>';
}
function geneView(sp,g){
  var t=INH[g.inheritance]||INH.unknown;
  var extra="";
  if(g.kind==="combo") extra='<div class="panel"><h4>STACK // 基因组成</h4><p>'+esc(g.composition||"—")+'</p></div><div class="panel"><h4>LOOK // 外观</h4><p>'+esc(g.appearance||g.phenotype)+'</p></div>';
  return '<div class="topbar"><button type="button" class="back" data-go="species" data-id="'+esc(sp.id)+'" aria-label="返回">‹</button><div class="kicker" style="line-height:40px">SPECIMEN FILE</div></div>'+tag(g.inheritance)+'<h2 style="font-size:1.4rem;margin-top:6px">'+esc(g.nameZh)+'</h2><div class="en" style="font-family:var(--display);letter-spacing:.12em">'+esc(g.nameEn)+'</div><p class="meta">'+esc(sp.nameZh)+' / '+esc(sp.nameEn)+' · '+esc(sp.scientific)+'</p>'+photoHtml(g)+'<div class="panel"><h4>INHERITANCE // 遗传方式</h4><p>'+esc(t.zh)+' · '+esc(t.en)+'<br>'+esc(t.hint)+'</p></div><div class="panel"><h4>PHENOTYPE // 表现型</h4><p>'+esc(g.phenotype)+'</p></div>'+extra+(g.note?'<div class="panel"><h4>CAUTION // 注意</h4><p>'+esc(g.note)+'</p></div>':'');
}
function render(){
  if(route.page==="home") view.innerHTML=homeView();
  else if(route.page==="species"){var sp=findSp(route.id);view.innerHTML=sp?speciesView(sp):homeView();}
  else if(route.page==="gene"){var s=findSp(route.sid);var g=s&&findG(s,route.id);view.innerHTML=g?geneView(s,g):homeView();}
  bindSearch();
}
function hashOf(r){
  if(r.page==="gene") return "#/s/"+r.sid+"/g/"+r.id;
  if(r.page==="species") return "#/s/"+r.id;
  if(r.page==="home") return "#/archive";
  return "#/";
}
function parseHash(){
  var parts=location.hash.replace(/^#/,"").split("/").filter(Boolean);
  if(parts[0]==="s"&&parts[2]==="g"&&parts[1]&&parts[3]) return {page:"gene",sid:parts[1],id:parts[3]};
  if(parts[0]==="s"&&parts[1]) return {page:"species",id:parts[1]};
  if(parts[0]==="archive") return {page:"home"};
  return {page:"cover"};
}
function apply(r,push){
  route=r;
  if(r.page==="cover"){archive.classList.remove("on");cover.classList.add("on");if(push) history.replaceState(null,"","#/");return;}
  cover.classList.remove("on","go");archive.classList.add("on");
  if(push) history.pushState(null,"",hashOf(r));
  window.scrollTo(0,0);render();
}
view.addEventListener("click",function(e){
  var btn=e.target.closest("[data-go]");if(!btn)return;
  var go=btn.getAttribute("data-go");q="";
  if(go==="home") apply({page:"home"},true);
  if(go==="species") apply({page:"species",id:btn.getAttribute("data-id")},true);
  if(go==="gene") apply({page:"gene",sid:btn.getAttribute("data-sid"),id:btn.getAttribute("data-id")},true);
});
document.getElementById("enter").addEventListener("click",function(){
  cover.classList.add("go");
  setTimeout(function(){apply({page:"home"},true);},480);
});
addEventListener("hashchange",function(){apply(parseHash(),false);});
var boot=parseHash();if(boot.page!=="cover") apply(boot,false);
var canvas=document.getElementById("pc"),ctx=canvas.getContext("2d"),parts=[],raf=0;
function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
function spawn(){var n=innerWidth<640?24:42;parts=[];for(var i=0;i<n;i++)parts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.4,v:Math.random()*.25+.05,a:Math.random()*.5+.15,c:Math.random()>.55?"0,240,255":"168,85,247"});}
function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);for(var i=0;i<parts.length;i++){var p=parts[i];p.y-=p.v;if(p.y<-4)p.y=innerHeight+4;ctx.beginPath();ctx.fillStyle="rgba("+p.c+","+p.a+")";ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}raf=requestAnimationFrame(tick);}
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){resize();spawn();tick();addEventListener("resize",function(){resize();spawn();},{passive:true});document.addEventListener("visibilitychange",function(){if(document.hidden)cancelAnimationFrame(raf);else tick();});}
var dnaHost=document.getElementById("dna");
if(dnaHost){
  var dna=document.createElement("canvas");dnaHost.appendChild(dna);var dctx=dna.getContext("2d");
  function drawHelix(t){
    var w=dnaHost.clientWidth||280,h=dnaHost.clientHeight||168,dpr=Math.min(window.devicePixelRatio||1,2);
    if(dna.width!==w*dpr||dna.height!==h*dpr){dna.width=w*dpr;dna.height=h*dpr;dctx.setTransform(dpr,0,0,dpr,0,0);}
    dctx.clearRect(0,0,w,h);var cx=w/2,amp=Math.min(46,w*.16),pairs=11,phase=t*.0011;
    for(var i=0;i<=pairs;i++){
      var y=12+(i/pairs)*(h-24),a=phase+i*.48,x1=cx+Math.sin(a)*amp,x2=cx+Math.sin(a+Math.PI)*amp,z1=Math.cos(a),z2=Math.cos(a+Math.PI);
      dctx.strokeStyle=z1>z2?"rgba(0,240,255,.28)":"rgba(168,85,247,.28)";dctx.lineWidth=1;dctx.beginPath();dctx.moveTo(x1,y);dctx.lineTo(x2,y);dctx.stroke();
      dctx.beginPath();dctx.fillStyle=z1>0?"rgba(0,240,255,.95)":"rgba(0,240,255,.35)";dctx.arc(x1,y,z1>0?3.1:2.1,0,Math.PI*2);dctx.fill();
      dctx.beginPath();dctx.fillStyle=z2>0?"rgba(168,85,247,.95)":"rgba(168,85,247,.35)";dctx.arc(x2,y,z2>0?3.1:2.1,0,Math.PI*2);dctx.fill();
    }
  }
  function loop(now){drawHelix(now);requestAnimationFrame(loop);}
  drawHelix(0);
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(loop);
}

})();
</script>
